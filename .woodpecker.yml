# =============================================================================
# Woodpecker CI Pipeline for Pear Music (static SPA)
# =============================================================================
# Branch: main - Build, push Docker image to GHCR, auto-deploy to Kubernetes
# =============================================================================

when:
  branch: [main, master]
  event: [push, manual]

variables:
  - &node_image node:24-alpine
  - &docker_image docker:24
  - &kubectl_image alpine/k8s:1.29.0
  - &image ghcr.io/micmnm/pear-music

steps:
  # ---------------------------------------------------------------------------
  # Install dependencies and build
  # ---------------------------------------------------------------------------
  build:
    image: *node_image
    environment:
      VITE_SUPABASE_URL:
        from_secret: supabase_url
      VITE_SUPABASE_ANON_KEY:
        from_secret: supabase_anon_key
    commands:
      - npm install --no-audit --no-fund
      - npm run build

  # ---------------------------------------------------------------------------
  # Build and push Docker image to GHCR
  # ---------------------------------------------------------------------------
  docker:
    image: *docker_image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GHCR_USER:
        from_secret: ghcr_user
      GHCR_TOKEN:
        from_secret: ghcr_token
      VITE_SUPABASE_URL:
        from_secret: supabase_url
      VITE_SUPABASE_ANON_KEY:
        from_secret: supabase_anon_key
    commands:
      - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - docker build --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" --build-arg VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" -t "ghcr.io/micmnm/pear-music:$(date +%Y%m%d)-${CI_PIPELINE_NUMBER}" -t "ghcr.io/micmnm/pear-music:latest" -f Dockerfile .
      - docker push "ghcr.io/micmnm/pear-music:$(date +%Y%m%d)-${CI_PIPELINE_NUMBER}"
      - docker push "ghcr.io/micmnm/pear-music:latest"
    depends_on: [build]

  # ---------------------------------------------------------------------------
  # Deploy to Kubernetes
  # ---------------------------------------------------------------------------
  deploy:
    image: *kubectl_image
    environment:
      HOME: /tmp
      KUBECONFIG_SECRET:
        from_secret: kubeconfig
      K8S_NAMESPACE:
        from_secret: k8s_namespace
    commands:
      - mkdir -p /tmp/.kube
      - echo "$KUBECONFIG_SECRET" > /tmp/.kube/config
      - chmod 600 /tmp/.kube/config
      - kubectl --kubeconfig=/tmp/.kube/config set image deployment/pear-music web="ghcr.io/micmnm/pear-music:$(date +%Y%m%d)-${CI_PIPELINE_NUMBER}" -n "$K8S_NAMESPACE"
      - kubectl --kubeconfig=/tmp/.kube/config rollout status deployment/pear-music -n "$K8S_NAMESPACE" --timeout=120s
    depends_on: [docker]

# =============================================================================
# Required Secrets (configure in Woodpecker UI)
# =============================================================================
# ghcr_user        - GitHub username (for ghcr.io login)
# ghcr_token       - GitHub PAT with write:packages scope
# kubeconfig       - Kubeconfig for the target Kubernetes cluster
# k8s_namespace    - Namespace to deploy into
# supabase_url     - Supabase project URL
# supabase_anon_key - Supabase anon key
#
# Required cluster secret (in target namespace):
#   kubectl -n <ns> create secret docker-registry registry-credentials \
#     --docker-server=ghcr.io \
#     --docker-username=<github-user> \
#     --docker-password=<github-pat-read:packages>
# =============================================================================
