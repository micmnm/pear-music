map $status $ecs_log_level {
    ~^5     "error";
    ~^4     "warn";
    default "info";
}

# The ingress sets X-Real-IP to the client address; fall back to the peer address.
map $http_x_real_ip $ecs_client {
    ""      $remote_addr;
    default $http_x_real_ip;
}

# Path as the client sent it, without the query string ($uri would be the rewritten path).
map $request_uri $ecs_path {
    ~^(?<ecs_path_only>[^?]*) $ecs_path_only;
    default                   $request_uri;
}

# Query string as the client sent it ($args is empty after the try_files fallback to /index.html).
map $request_uri $ecs_query {
    ~\?(?<ecs_query_only>.*)$ $ecs_query_only;
    default                   "";
}

# One ECS JSON object per request. nginx cannot multiply, so the duration is
# nginx.request_time in seconds, not event.duration in nanoseconds.
log_format ecs_json escape=json
  '{'
    '"@timestamp":"$time_iso8601",'
    '"ecs.version":"8.11.0",'
    '"log.level":"$ecs_log_level",'
    '"message":"$request_method $ecs_path $status",'
    '"service.name":"pear-music",'
    '"event.dataset":"nginx.access",'
    '"http.request.method":"$request_method",'
    '"url.path":"$ecs_path",'
    '"url.query":"$ecs_query",'
    '"http.response.status_code":$status,'
    '"http.response.body.bytes":$body_bytes_sent,'
    '"source.address":"$ecs_client",'
    '"user_agent.original":"$http_user_agent",'
    '"http.request.referrer":"$http_referer",'
    '"nginx.request_time":$request_time'
  '}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout ecs_json;
    error_log  /dev/stderr warn;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
